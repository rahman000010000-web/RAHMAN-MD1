services:
    - type: web
    name: HACKER-MD
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
            - key: NODE_VERSION
        value: 18.20.0
            - key: SESSION_ID
        sync: false
            - key: OWNER_NUMBER
        sync: false
            - key: PREFIX
        value: .
            - key: MODE
        value: private